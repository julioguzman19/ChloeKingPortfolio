<section id="experience" class="section-shell bg-surface text-graphite">
  <div class="mx-auto max-w-7xl">
    <app-section-heading title="Experience" />

    <div class="mt-7 grid items-stretch gap-7 md:grid-cols-2">
      @for (experience of experiences; track experience.id) {
        <app-experience-card [project]="experience"></app-experience-card>
      }
    </div>
  </div>
</section>
