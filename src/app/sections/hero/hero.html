<section
  id="home"
  class="relative isolate min-h-[580px] scroll-mt-20 overflow-hidden bg-canvas px-6 py-10 text-graphite sm:min-h-[620px] sm:py-14 lg:min-h-[560px] lg:px-10 lg:py-20"
>
  <!-- Background image -->
  <img
    src="images/hero-engineering.webp"
    alt=""
    aria-hidden="true"
    class="absolute inset-0 -z-30 h-full w-full object-cover object-[40%_center] sm:object-[42%_center] lg:object-[55%_58%]"
  />

  <!-- Mobile overlay: readable at top, clearer image toward bottom -->
  <div
    class="absolute inset-0 -z-20 bg-gradient-to-b from-canvas from-5% via-canvas/85 via-48% to-canvas/10 lg:hidden"
  ></div>

  <!-- Desktop overlay -->
  <div
    class="absolute inset-0 -z-20 hidden lg:block"
    style="
      background: linear-gradient(
        90deg,
        rgba(244, 241, 234, 0.98) 0%,
        rgba(244, 241, 234, 0.92) 30%,
        rgba(244, 241, 234, 0.5) 48%,
        rgba(244, 241, 234, 0.08) 66%,
        transparent 78%
      );
    "
  ></div>

  <div class="mx-auto flex w-full max-w-7xl items-start lg:items-center">
    <!-- Hero text -->
    <div class="max-w-xl lg:max-w-[610px]">
      <p
        class="flex flex-col gap-1 text-sm font-medium uppercase leading-6 tracking-[0.25em] text-copper sm:flex-row sm:items-center sm:gap-3 lg:text-base lg:tracking-[0.3em]"
      >
        <span>Mechanical Engineer</span>

        <span class="hidden sm:inline" aria-hidden="true">·</span>

        <span>Product Designer</span>
      </p>

      <h1
        class="mt-4 text-4xl font-semibold leading-none tracking-tight sm:text-5xl lg:mt-6 lg:text-[5.25rem]"
      >
        Hi, I’m Chloe.
      </h1>

      <p
        class="mt-5 max-w-md text-base leading-7 text-graphite/70 sm:max-w-lg sm:text-lg lg:mt-7 lg:max-w-xl lg:text-xl lg:leading-8"
      >
        I combine technical problem-solving with hands-on design to create practical, manufacturable
        products.
      </p>

      <!-- Capabilities -->
      <div
        class="mt-7 grid grid-cols-2 gap-x-6 gap-y-4 border-t border-graphite/15 pt-5 text-sm font-medium text-graphite/65 sm:flex sm:flex-wrap sm:gap-x-8 lg:mt-9 lg:border-0 lg:pt-0 lg:text-base"
      >
        <span>CAD Design</span>
        <span>Prototyping</span>
        <span>Testing</span>
        <span>Manufacturing</span>
      </div>
    </div>
  </div>
</section>
